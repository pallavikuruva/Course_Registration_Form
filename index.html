    <h1>Course Registration Form</h1>
    <form action="">
      <fieldset>
        <legend>Personal Details</legend>
        <table>
          <tr>
            <td><label for="FN">First Name</label></td>
            <td>
              <input
                type="text"
                placeholder="Ex: xxxx"
                name="FN"
                id="FN"
                value=""
                maxlength="25"
                required
              />
               <p class="tooltip">Enter full name</p>
            </td>
           
          </tr>
          <tr>
            <td><label for="SN">Sur Name</label></td>
            <td>
              <input
                type="text"
                placeholder="Ex:xxx"
                name="SN"
                maxlength="25"
                required
              />
            </td>
          </tr>
          <tr>
            <td><label for="PN">Phone</label></td>
            <td>
              <input
                type="tel"
                placeholder="Ex:5241638879"
                name="PN"
                id="PN"
                pattern="[0-9]{10}"
                maxlength="10"
                required
              />
               <p class="tooltip">Enter valid number</p>
            </td>
           
          </tr>

          <tr>
            <td><label for="age">Age</label></td>
           <td>
          <input
          type="number"
          id  ="age"
          name="age"
          min="18"
          max="65"
          step="1"
          value="21"
            required
    
          />
          
          <p class="tooltip">Select your age between 18-65</p>

</td>

               <p class="tooltip">Enter in between range</p>
            </td>
           
          </tr>
          <tr>

            </td>
            
          </tr>
          <tr>
            <td><label for="dob">DOB</label></td>

              <input
                type="date"
                placeholder="Ex:dd-mm-yyyy"
                name="dob"
                value=""
              />
            </td>
          </tr>
          <tr>
            <td><label for="g">Gender</label></td>
            <td>
              <input type="radio" value="Male" name="g" />
              <label for="Male">Male</label>
              <input type="radio" value="Female" name="g" />
               <label for="Female">Female</label>
              <input type="radio" value="Other" name="g" />
             <label for="Custom">Custom</label>
            </td>
          </tr>
          <tr>
            <td><label for="">Select Country</label></td>
            <td>
              <select name="Country">
                <option value="None">None</option>
                <option value="INDIA">INDIA</option>
                <option value="UK">UK</option>
                <option value="USA">USA</option>
                <option value="EUROPE">EUROPE</option>
                <option value="AUSTRALIA">AUSTRALIA</option>
              </select>
            </td>
          </tr>
          <tr>
            <td><label for="pic">Upload Picture</label></td>
            <td><input type="file" name="pic" id="pic" /></td>
          </tr>
          <tr>
            <td><button type="reset">Reset</button></td>
          </tr>
        </table>
      </fieldset>
      <fieldset>
        <legend id="cd">Course details</legend>
        <table>
          <tr>
            <td>
              <label for="">Select Course</label>
            </td>
            <td>
              <select name="Course" id="">
                <option value="Java Full Stack">Java Full Stack</option>
                <option value="Python Full Stack">Python Full Stack</option>
                <option value="Mern Stack">Mern Stack</option>
                <option value="Data Science">Data Science</option>
              </select>
            </td>
          </tr>
          <tr>
            <td><label>Mode</label></td>
            <td>
              <input type="radio" value="Online" />
              <label for="">Online</label>
              <input type="radio" value="Online" />
              <label for="">Offline</label>
            </td>
          </tr>
          <tr>
            <td><label for="FN">SKILLS</label></td>
            <td>
              <input
                type="text"
                placeholder="Ex: xxxx"
                name="FN"
                value="HTML5"
                maxlength="25"
                readonly
              />
            </td>
          </tr>

          <tr>
            <td>
              <label for="">Comments</label>
            </td>
            <td>
              
                
                <textarea class="ta"
                placeholder="write your feedback.."
                  id="feedback"
                  name="feedback"
                  rows="6"
                  cols="50"
                ></textarea>
              
            </td>
          </tr>
          <tr>
            <td><button>Submit</button></td>
          </tr>
        </table>
      </fieldset>
   </form>
